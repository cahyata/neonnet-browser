<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>HISTORY</title>
<style>
:root{--bg:#12062c;--bg2:#0a0420;--row:#1b0b3d;--pink:#ff2e97;--pink2:#ff7bc0;--cyan:#00e5ff;--yellow:#ffd600;--muted:#8a6fc0}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:#e8d8ff;font:13px "Cascadia Mono","Consolas","Courier New",monospace}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.15) 2px 3px)}
.topbar{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--cyan);box-shadow:0 4px 24px rgba(10,4,32,.85)}
.top-row{max-width:1100px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{color:var(--yellow);font-weight:bold;letter-spacing:1.5px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand b{color:var(--pink)}
.tbadge{padding:1px 6px;border:1px solid var(--green);color:var(--green);font-size:11px;letter-spacing:1px}
.addr{flex:1;min-width:220px;height:32px;display:flex;align-items:center;border:1px solid var(--cyan);background:var(--bg2);
  clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
.addr span{color:var(--pink);padding:0 6px 0 10px;user-select:none}
.addr input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;color:var(--cyan);font:12px "Cascadia Mono","Consolas",monospace}
.addr input::placeholder{color:#5e4a8f}
.addr button{height:100%;border:0;background:none;color:var(--muted);padding:0 10px;cursor:pointer;font:inherit;display:none}
.addr button.show{display:block}
.addr button:hover{color:var(--pink)}
.hud-links{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hud-link{height:30px;padding:0 10px;border:1px solid var(--muted);color:var(--muted);font:bold 11px "Cascadia Mono","Consolas",monospace;letter-spacing:1px;display:inline-flex;align-items:center;text-decoration:none}
.hud-link:hover{border-color:var(--cyan);color:var(--bg);background:var(--cyan);text-decoration:none}
.hud-link.on{border-color:var(--cyan);color:var(--cyan);background:rgba(0,229,255,.1)}
main{max-width:1100px;margin:0 auto;padding:22px 18px 60px}
.tools{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}
.sub{color:var(--yellow);letter-spacing:1.5px;font-size:12px}
.search{flex:1;display:flex;align-items:center;height:36px;border:1px solid var(--cyan);background:var(--bg2);
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.search span{color:var(--pink);padding:0 6px 0 12px}
.search input{flex:1;height:100%;background:none;border:0;outline:0;color:var(--cyan);font:14px "Cascadia Mono","Consolas",monospace}
.search input::placeholder{color:#5a4a8a}
button{font:inherit;cursor:pointer;border:0}
.danger{height:36px;padding:0 16px;background:none;border:1px solid var(--pink);color:var(--pink);font-weight:bold}
.danger:hover{background:var(--pink);color:var(--bg)}
a.danger{display:inline-flex;align-items:center;text-decoration:none;white-space:nowrap}
h2{font:bold 12px "Cascadia Mono","Consolas",monospace;color:var(--yellow);letter-spacing:2px;margin:22px 0 6px;
  padding-bottom:4px;border-bottom:1px solid rgba(255,46,151,.5)}
.row{display:flex;align-items:center;gap:12px;padding:6px 8px;min-height:32px}
.row:hover{background:var(--row)}
.time{color:var(--muted);width:44px;flex:none}
.row a{flex:1;min-width:0;display:flex;gap:10px;color:var(--cyan);text-decoration:none;overflow:hidden;white-space:nowrap}
.row a:hover .t{text-decoration:underline}
.t{overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.h{color:var(--muted);overflow:hidden;text-overflow:ellipsis;flex:1 1 0;min-width:60px}
.x{width:24px;height:24px;background:none;color:var(--muted);visibility:hidden;flex:none}
.row:hover .x{visibility:visible}
.x:hover{background:var(--pink);color:var(--bg)}
.empty{color:var(--muted);margin-top:40px;text-align:center;letter-spacing:1px}
</style>
</head>
<body>
<header class="topbar">
  <div class="top-row">
    <div class="brand">&#9632; <b>NEON</b>NET // HISTORY <span class="tbadge">90 DAYS</span></div>
    <div class="addr">
      <span>&gt;&gt;</span>
      <input id="q" spellcheck="false" autocomplete="off" placeholder="search history (Ctrl+K)">
      <button id="qClear" title="Clear filter">&#10005;</button>
    </div>
    <div class="hud-links">
      <a class="hud-link" href="https://neonnet.ui/settings.html">SETTINGS</a>
      <a class="hud-link" href="https://neonnet.ui/extensions.html">EXTENSIONS</a>
      <a class="hud-link" href="https://neonnet.ui/bookmarks.html">BOOKMARKS</a>
      <a class="hud-link on" href="https://neonnet.ui/history.html">HISTORY</a>
      <a class="hud-link" href="https://neonnet.ui/downloads.html">DOWNLOADS</a>
    </div>
  </div>
</header>
<main>
  <div class="tools">
    <div class="sub">&gt; ACCESS LOG // LAST 90 DAYS</div>
    <a class="danger" id="clear" href="https://neonnet.ui/settings.html?clear=history#privacy" title="Choose what to delete and for how long">CLEAR BROWSING DATA</a>
  </div>
  <div id="list"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const safe = u => /^(https?:|file:)/i.test(u);
const pad = n => String(n).padStart(2, '0');

function dayLabel(d){
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const day = new Date(d); day.setHours(0, 0, 0, 0);
  const diff = Math.round((today - day) / 86400000);
  const date = d.toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long', year:'numeric'}).toUpperCase();
  return diff === 0 ? 'TODAY - ' + date : diff === 1 ? 'YESTERDAY - ' + date : date;
}

function host(u){ try { return new URL(u).host || u; } catch(e){ return u; } }

async function load(){
  const q = $('#q').value.trim();
  let items = [];
  try { items = await (await fetch('/api/history?q=' + encodeURIComponent(q), {cache:'no-store'})).json(); } catch(e){}
  const list = $('#list'); list.innerHTML = '';
  if(!items.length){
    const e = document.createElement('div'); e.className = 'empty';
    e.textContent = q ? 'NO MATCHES FOR "' + q.toUpperCase() + '"' : 'NO HISTORY YET. GO EXPLORE THE GRID.';
    list.appendChild(e); return;
  }
  let lastDay = '';
  for(const it of items){
    const d = new Date(it.time);
    const label = dayLabel(d);
    if(label !== lastDay){
      const h = document.createElement('h2'); h.textContent = label; list.appendChild(h); lastDay = label;
    }
    const row = document.createElement('div'); row.className = 'row';
    const tm = document.createElement('span'); tm.className = 'time'; tm.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
    const a = document.createElement('a');
    if(safe(it.url)) a.href = it.url;
    a.title = it.url;
    const t = document.createElement('span'); t.className = 't'; t.textContent = it.title || it.url;
    const hs = document.createElement('span'); hs.className = 'h'; hs.textContent = host(it.url);
    a.append(t, hs);
    const x = document.createElement('button'); x.className = 'x'; x.title = 'Remove from history'; x.innerHTML = '&#10005;';
    x.onclick = async () => {
      await fetch('/api/history/delete?id=' + it.id, {cache:'no-store'}).catch(() => {});
      row.remove();
    };
    row.append(tm, a, x);
    list.appendChild(row);
  }
}

let timer = 0;
function syncClear(){ $('#qClear').classList.toggle('show', $('#q').value.length > 0); }
$('#q').addEventListener('input', () => { syncClear(); clearTimeout(timer); timer = setTimeout(load, 150); });
$('#qClear').onclick = () => { $('#q').value = ''; syncClear(); load(); $('#q').focus(); };
document.addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); $('#q').focus(); $('#q').select(); }
});

// Clearing the history, with a period, is part of "Clear browsing data" on the settings page.
load();
</script>
</body>
</html>
